name: RPPRAC
type: theme
description: 'Thème dérivé de Bootstrap5 pour le site RPPRAC.'
package: Custom
core_version_requirement: ^10.1 || ^11
base theme: bootstrap5
logo: logo.png
libraries:
  - rpprac/global-styling
libraries-extend:
  user/drupal.user:
    - bootstrap5/user
  core/drupal.dropbutton:
    - bootstrap5/dropbutton
  core/drupal.dialog:
    - bootstrap5/dialog
  file/drupal.file:
    - bootstrap5/file
  core/drupal.progress:
    - bootstrap5/progress

regions:
  header: En-tete
  nav_branding: 'Navigation marque'
  nav_main: 'Navigation principale'
  nav_additional: 'Navigation complementaire'
  breadcrumb: 'Fil d''ariane'
  home_hero: 'Accueil - Hero'
  home_highlights: 'Accueil - Mise en avant'
  home_positioning: 'Accueil - Positionnement'
  home_expertises: 'Accueil - Expertises'
  home_targets: 'Accueil - Cibles'
  home_differentiation: 'Accueil - Differenciation'
  home_realizations: 'Accueil - Realisations'
  home_method: 'Accueil - Methode'
  home_local: 'Accueil - Ancrage local'
  home_contact: 'Accueil - Contact final'
  front_hero: 'Front hero'
  front_highlights: 'Front highlights'
  content: 'Contenu principal'
  sidebar_first: 'Barre laterale gauche'
  sidebar_second: 'Barre laterale droite'
  footer: Pied de page
settings:
  enable_logo: true
  enable_name: true
